[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mapstippler"
version = "0.7.6"
description = "Pseudo-random, blue-noise and graduated dot maps"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas D. Arnold", email = "nicholas.d.arnold@gmail.com" }]
keywords = ["cartography", "dot map", "dot density", "blue noise", "CCVT", "stippling", "GIS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "pandas>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyarrow>=10",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/nick-arnold/mapstippler"
Source = "https://github.com/nick-arnold/mapstippler"
Issues = "https://github.com/nick-arnold/mapstippler/issues"

[project.scripts]
mapstippler = "mapstippler.__main__:main"

[tool.setuptools]
packages = ["mapstippler"]
